# SAE AutoSim Hub — nginx site configuration.
# Serves the SPA and reverse-proxies /api to the FastAPI backend service.

# Basic rate limiting for the API (login brute-force protection etc.)
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=30r/s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------------ security --
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---------------------------------------------------------------- gzip --
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ----------------------------------------------------------- static SPA --
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|mjs|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # ------------------------------------------------------ API reverse proxy --
    location /api/ {
        limit_req zone=api_zone burst=60 nodelay;

        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (simulation stream: /api/v1/simulations/{id}/stream)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Large network uploads (SUMO/OpenDRIVE files) — backend caps at 10 MB.
    client_max_body_size 16m;
}
